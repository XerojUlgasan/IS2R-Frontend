<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="IS²R - Inventory control for the modern print shop."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>IS²R Inventory</title>

    <!-- Design system base styles (preserved from source pages) -->
    <style>
      @layer base {
        html,
        body {
          margin: 0;
          padding: 0;
        }
        body {
          overscroll-behavior: none;
        }
        main > :first-child {
          margin-top: 0 !important;
        }
        main > :last-child {
          margin-bottom: 0 !important;
        }
      }
      ::-webkit-scrollbar {
        display: none;
      }
    </style>

    <script src="https://cdn.tailwindcss.com"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-primary-container": "#848484",
              "surface-tint": "#5e5e5e",
              "on-tertiary": "#ffffff",
              "surface-container-lowest": "#ffffff",
              "surface-container": "#eeeeee",
              "on-tertiary-fixed-variant": "#474747",
              background: "#f9f9f9",
              "primary-fixed": "#e2e2e2",
              "surface-bright": "#f9f9f9",
              "primary-container": "#1b1b1b",
              "tertiary-fixed-dim": "#c6c6c6",
              error: "#ba1a1a",
              "surface-container-low": "#f3f3f3",
              primary: "#000000",
              "inverse-primary": "#c6c6c6",
              "on-error-container": "#93000a",
              "inverse-on-surface": "#f1f1f1",

              "secondary-container": "#e1dfdf",

              "on-background": "#1a1c1c",

              surface: "#f9f9f9",
              "on-primary-fixed": "#1b1b1b",
              "on-secondary-container": "#626262",
              outline: "#7e7576",

              md: "16px",

              gutter: "20px",
              sm: "8px",
              xl: "48px",
              unit: "4px",

    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />

      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Syne:wght@100..900&display=swap"
